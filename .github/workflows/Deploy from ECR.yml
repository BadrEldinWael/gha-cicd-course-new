name: Deploy from ECR

on:
  push:
    branches: [main]

env:
  ECR_REPO: 998718205915.dkr.ecr.us-east-1.amazonaws.com/githublab
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # ✅ required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::998718205915:role/Badr-githubactionrole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          IMAGE_TAG="${TODAY}-${GITHUB_RUN_ID}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Pull image from ECR
        run: |
          docker pull $ECR_REPO:${{ steps.image-tag.outputs.image_tag }}

      - name: Run container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p $APP_PORT:8000 \
            $ECR_REPO:${{ steps.image-tag.outputs.image_tag }}

      - name: Show running containers
        run: docker ps

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl --silent http://127.0.0.1:$APP_PORT/health || true)

            if [ -n "$RESPONSE" ]; then
              echo "Health response:"
              echo "$RESPONSE"
              exit 0
            fi

            echo "Waiting..."
            sleep 2
          done

          echo "App failed"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f $CONTAINER_NAME || true
